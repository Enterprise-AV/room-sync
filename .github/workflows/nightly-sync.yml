name: Nightly Sync

on:
  schedule:
    - cron: '0 9 * * *'  # 2 AM PT (UTC-7)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run nightly sync
        run: python -m sync.main
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          NEAT_API_KEY: ${{ secrets.NEAT_API_KEY }}
          NEAT_ORG_ID: ${{ secrets.NEAT_ORG_ID }}
          XYTE_API_KEY: ${{ secrets.XYTE_API_KEY }}
          XYTE_ORG_ID: ${{ secrets.XYTE_ORG_ID }}

      - name: Upload raw snapshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-snapshots-${{ github.run_id }}
          path: data/snapshots/raw/
          retention-days: 90

      - name: Commit sanitized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit sanitized snapshots (raw/ is gitignored)
          git add data/ --ignore-errors
          git diff --cached --quiet || git commit -m "Nightly sync $(date -u +%Y-%m-%d)"
          git push
