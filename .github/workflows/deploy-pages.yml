name: Deploy Pages

on:
  push:
    paths:
      - 'data/**'
      - 'docs/**'
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Nightly Sync", "Apply Changes"]
    types: [completed]

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp -r data/ _site/data/
          cp config/locations.json _site/data/locations.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
