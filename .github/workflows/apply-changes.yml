name: Apply Changes

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'approve-mapping | create-rooms | decommission'
        required: true
        type: choice
        options:
          - approve-mapping
          - create-rooms
          - decommission
      payload:
        description: 'JSON payload with the changes to apply'
        required: true
        type: string

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Apply changes
        run: python -m sync.main --${{ github.event.inputs.action }}
        env:
          APPLY_PAYLOAD: ${{ github.event.inputs.payload }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          NEAT_API_KEY: ${{ secrets.NEAT_API_KEY }}
          NEAT_ORG_ID: ${{ secrets.NEAT_ORG_ID }}
          XYTE_API_KEY: ${{ secrets.XYTE_API_KEY }}
          XYTE_ORG_ID: ${{ secrets.XYTE_ORG_ID }}

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Applied: ${{ github.event.inputs.action }}"
          git push
